version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fin-r1-web
    ports:
      - "9001:80"
    volumes:
      # 如果需要实时更新文件，可以挂载目录（生产环境建议去掉）
      # - ./:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - finr1-network

networks:
  finr1-network:
    driver: bridge

